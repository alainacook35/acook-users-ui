<svg width="570" height="108" viewBox="30 48 570 108" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6aa7ce"/>
      <stop offset="100%" stop-color="#4f7d9b"/>
    </linearGradient>
  </defs>

  <!-- Icon: overlapping user circles suggesting grouping/sorting -->
  <g transform="translate(40, 55)">
    <circle cx="30" cy="30" r="28" fill="url(#iconGrad)" opacity="0.9"/>
    <circle cx="62" cy="30" r="28" fill="#4a5568" opacity="0.85"/>

    <!-- simple person glyphs -->
    <circle cx="30" cy="20" r="8" fill="#ffffff"/>
    <path d="M 12 46 Q 30 26 48 46 L 48 52 L 12 52 Z" fill="#ffffff"/>

    <circle cx="62" cy="20" r="8" fill="#ffffff"/>
    <path d="M 44 46 Q 62 26 80 46 L 80 52 L 44 52 Z" fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <text x="150" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#1a202c">
    users<tspan fill="#6aa7ce">.com</tspan>
  </text>

  <!-- Tagline -->
  <text x="150" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0.5" fill="#718096">
    sorting and filtering users since 2026
  </text>

  <!-- Accent underline -->
  <rect x="150" y="148" width="220" height="3" rx="1.5" fill="#6aa7ce"/>
</svg>
